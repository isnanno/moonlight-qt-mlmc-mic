name: Release Windows Portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.7.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: 'C:\Qt\6.7.3'
          install-deps: 'true'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch dependencies
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Build release portable
        shell: cmd
        run: |
          set PATH=C:\Qt\6.7.3\msvc2019_64\bin;%PATH%
          call scripts\build-release-local.bat

      - name: Package portable zip
        shell: pwsh
        run: |
          $tag = 'v6.1.0-mlmc.3'
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME }
          $zip = "build/Moonlight-qt-mlmc-$tag-win64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path build/deploy-x64-release/* -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"

      - name: Package host receiver
        shell: pwsh
        run: |
          $tag = 'v6.1.0-mlmc.3'
          if ($env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME }
          ./scripts/package-host-receiver.ps1 -Version $tag

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Moonlight-qt-mlmc-*-win64-portable.zip
            build/Moonlight-qt-mlmc-host-receiver-*-win.zip

      - name: Upload assets to v6.1.0-mlmc.3 release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Get-ChildItem build -Filter 'Moonlight-qt-mlmc-*.zip' | ForEach-Object { Write-Host $_.FullName }
          gh release upload v6.1.0-mlmc.3 (Get-ChildItem build -Filter 'Moonlight-qt-mlmc-*.zip' | ForEach-Object { $_.FullName }) --repo isnanno/moonlight-qt-mlmc-mic --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-qt-mlmc-windows
          path: |
            build/Moonlight-qt-mlmc-*-win64-portable.zip
            build/Moonlight-qt-mlmc-host-receiver-*-win.zip
